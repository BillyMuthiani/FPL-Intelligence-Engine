[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-engine"
version = "0.1.0"
description = "FPL Intelligence Engine - Fantasy Premier League analytics and decision-support platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BillyMuthiani"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<25",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.14,<4",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/BillyMuthiani/fpl-intelligence-engine"
Repository = "https://github.com/BillyMuthiani/fpl-intelligence-engine"
Issues = "https://github.com/BillyMuthiani/fpl-intelligence-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fpl_engine*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function call in default argument
    "N802",  # function name should be lowercase
]
per-file-ignores = { "tests/*" = ["S101", "S106", "B011"] }

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "httpx.*",
    "pandas.*",
    "structlog.*",
]
ignore_missing_imports = true